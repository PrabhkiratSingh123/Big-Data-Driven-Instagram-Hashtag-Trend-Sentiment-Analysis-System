version: '3.8'

services:
  # ==================== Infrastructure ====================
  # NOTE: MongoDB runs locally (MongoDB Compass) — not in Docker.
  # Make sure your local MongoDB is running on localhost:27017
  # before starting these services.

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ig-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    networks:
      - instagram-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ig-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 1048576
    networks:
      - instagram-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  spark-master:
    image: bitnami/spark:3.5
    container_name: ig-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - instagram-network
    restart: unless-stopped

  spark-worker:
    image: bitnami/spark:3.5
    container_name: ig-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2g}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    networks:
      - instagram-network
    restart: unless-stopped

  # ==================== Kafka Topic Setup ====================

  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ig-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo '⏳ Creating Kafka topics...' &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092
          --partitions 3 --replication-factor 1
          --topic instagram-posts &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092
          --partitions 3 --replication-factor 1
          --topic processed-sentiments &&
        echo '✅ Kafka topics created successfully' &&
        kafka-topics --list --bootstrap-server kafka:29092
      "
    networks:
      - instagram-network

  # ==================== Application Services ====================

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: ig-ingestion
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # host.docker.internal resolves to the host machine's localhost
      MONGO_URI: mongodb://host.docker.internal:27017
      MONGO_DB: instagram_analytics
      BATCH_SIZE: ${BATCH_SIZE:-50}
      BATCH_INTERVAL: ${BATCH_INTERVAL:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - instagram-network
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ig-dashboard
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      MONGO_URI: mongodb://host.docker.internal:27017
      MONGO_DB: instagram_analytics
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - instagram-network
    restart: unless-stopped

networks:
  instagram-network:
    driver: bridge
    name: instagram-network
